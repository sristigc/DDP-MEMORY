<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDP Memory Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.180.0/"
  }
}
</script>
<style>
  /* Monochrome: black, greys, white. Obsidian-style graph panel. */
  :root {
    --bg:#000000; --panel:rgba(16,16,19,.92); --line:#2a2a2f; --ivory:#e6e6e6; --muted:#8a8a90;
    --gold:#f2f2f2; --gold-dim:#77777d; --live:#ffffff;
    --display:"Space Grotesk", "Segoe UI", sans-serif; --body:"Inter", "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ivory); font:13px/1.45 var(--body); overflow:hidden; }
  #graph { position:fixed; inset:0; }

  #titlebar { position:fixed; top:0; left:0; right:0; height:34px; display:flex; align-items:center; gap:14px; padding:0 14px;
              background:rgba(12,12,14,.9); border-bottom:1px solid var(--line); z-index:2; }
  #titlebar h1 { font:700 13px var(--display); letter-spacing:.08em; color:var(--ivory); margin:0; }
  #status { font:500 10px var(--display); letter-spacing:.2em; color:var(--muted); }
  #statsline { margin-left:auto; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  #statsline b { color:var(--ivory); font-weight:600; }

  /* Obsidian-like collapsible panel */
  #panel { position:fixed; top:46px; left:12px; width:250px; max-height:calc(100% - 60px); overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:4px 0; z-index:2; }
  details { border-bottom:1px solid var(--line); }
  details:last-child { border-bottom:0; }
  summary { list-style:none; cursor:pointer; padding:7px 12px; font:600 12px var(--display); letter-spacing:.08em; color:var(--ivory); user-select:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; display:inline-block; width:14px; color:var(--muted); transition:transform .15s; }
  details[open] > summary::before { transform:rotate(90deg); }
  .sec { padding:2px 12px 10px 26px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; }
  .row label { color:var(--ivory); }
  .row small { color:var(--muted); font-variant-numeric:tabular-nums; }
  input[type=checkbox] { accent-color:var(--gold); }
  input[type=range] { width:100%; accent-color:var(--gold); }
  .slider { margin:6px 0 2px; }
  .slider .row { margin:0; }
  select, input[type=search] { width:100%; background:#0b0a0f; color:var(--ivory); border:1px solid var(--line); border-radius:3px; padding:5px 7px; font:13px var(--body); }
  .seg { display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .seg button { flex:1; background:transparent; color:var(--muted); border:0; padding:5px 0; font:600 10px var(--display); letter-spacing:.08em; cursor:pointer; }
  .seg button.on { background:rgba(255,255,255,.08); color:var(--gold); }
  .group { display:flex; align-items:center; gap:8px; padding:2px 0; cursor:pointer; }
  .group:hover { color:var(--gold); }
  .swatch { width:11px; height:11px; border-radius:50%; flex:none; border:1px solid rgba(255,255,255,.2); }
  .live-tag { margin-left:auto; font:500 9px var(--display); letter-spacing:.2em; color:var(--live); }
  .live-tag::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); margin-right:5px; animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .muted { color:var(--muted); }

  #right { position:fixed; top:46px; right:12px; width:320px; max-height:calc(100% - 110px); overflow:auto; display:none;
           background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px 14px; z-index:2; }
  #right h3 { font:700 14px var(--display); letter-spacing:.12em; margin:0 0 2px; color:var(--gold); word-break:break-word; }
  #right h4 { font:500 10px var(--display); letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:12px 0 5px; }
  .kv { display:grid; grid-template-columns:72px 1fr; gap:3px 10px; margin:0; word-break:break-word; }
  .kv dt { font:500 10px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding-top:3px; }
  .kv dd { margin:0; }
  .close { float:right; cursor:pointer; color:var(--muted); }

  #controls { position:fixed; right:12px; bottom:12px; display:flex; gap:6px; z-index:2; }
  .btn { background:var(--panel); color:var(--ivory); border:1px solid var(--line); border-radius:3px; min-width:36px; height:34px; padding:0 11px;
         font:500 11px var(--display); letter-spacing:.16em; cursor:pointer; }
  .btn:hover { border-color:var(--gold-dim); color:var(--gold); }
  .btn.on { border-color:var(--gold); color:var(--gold); }
  .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--gold); color:#000; font:600 11px var(--body); }
  #feed { position:fixed; right:12px; bottom:54px; width:400px; max-height:40vh; overflow:auto; display:none;
          background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 14px; z-index:2; }
  #feed .ev { padding:4px 0; border-bottom:1px solid var(--line); font-size:15px; }
  #feed .ev.shared .what, #feed .ev.shared b { color:var(--gold); }
  #feed time { color:var(--muted); margin-right:8px; font-size:13px; font-variant-numeric:tabular-nums; }
  @media (max-width: 720px) { #panel { width:calc(100% - 24px); max-height:40vh; } #right, #feed { width:calc(100% - 24px); } #statsline { display:none; } }
</style>
</head>
<body>
<div id="graph"></div>

<div id="titlebar">
  <h1>DDP MEMORY Graph</h1><span id="status">CONNECTING…</span>
  <a href="system.html" style="color:var(--muted);text-decoration:none;font-size:12px">System →</a>
  <span id="statsline"></span>
</div>

<div id="panel">
  <details open>
    <summary>Views</summary>
    <div class="sec">
      <div class="seg" id="dimSeg"><button data-dim="3" class="on">3D</button><button data-dim="2">2D</button></div>
    </div>
  </details>
  <details open>
    <summary>Filters</summary>
    <div class="sec">
      <input type="search" id="search" placeholder="Search files, tickets, people…">
      <div class="row"><label><input type="checkbox" data-type="ticket" checked> Tickets</label></div>
      <div class="row"><label><input type="checkbox" data-type="service" checked> Services</label></div>
      <div class="row"><label><input type="checkbox" data-type="file" checked> Files</label></div>
      <div class="row"><label><input type="checkbox" data-type="session"> Sessions</label></div>
      <div class="row"><label><input type="checkbox" id="sharedOnly"> Shared context only</label></div>
    </div>
  </details>
  <details open>
    <summary>Groups</summary>
    <div class="sec">
      <div class="row"><span class="muted">Colour by</span></div>
      <div class="seg" id="colorBySeg"><button data-by="role" class="on">Role</button><button data-by="person">Person</button><button data-by="service">Service</button><button data-by="type">Type</button><button data-by="mono">Mono</button></div>
      <div id="groups" style="margin-top:8px"></div>
    </div>
  </details>
  <details>
    <summary>Display</summary>
    <div class="sec">
      <div class="slider"><div class="row"><label>Node size</label><small id="v-nodeSize"></small></div><input type="range" id="nodeSize" min="0.3" max="3" step="0.1" value="1"></div>
      <div class="slider"><div class="row"><label>Link thickness</label><small id="v-linkWidth"></small></div><input type="range" id="linkWidth" min="0" max="2" step="0.1" value="0"></div>
      <div class="slider"><div class="row"><label>Link opacity</label><small id="v-linkOpacity"></small></div><input type="range" id="linkOpacity" min="0.02" max="0.9" step="0.02" value="0.5"></div>
      <div class="row"><label>Labels</label>
        <select id="labels" style="width:auto"><option value="people">People</option><option value="tickets">People + tickets</option><option value="none">None</option></select></div>
      <div class="row"><label><input type="checkbox" id="globes" checked> Person globes</label></div>
      <div class="row"><label><input type="checkbox" id="bloom" checked> Glow on live threads</label></div>
    </div>
  </details>
  <details>
    <summary>Forces</summary>
    <div class="sec">
      <div class="slider"><div class="row"><label>Center force</label><small id="v-center"></small></div><input type="range" id="center" min="0" max="0.1" step="0.002" value="0.008"></div>
      <div class="slider"><div class="row"><label>Repel force</label><small id="v-repel"></small></div><input type="range" id="repel" min="0" max="300" step="5" value="90"></div>
      <div class="slider"><div class="row"><label>Link force</label><small id="v-linkForce"></small></div><input type="range" id="linkForce" min="0" max="1" step="0.01" value="0.06"></div>
      <div class="slider"><div class="row"><label>Link distance</label><small id="v-linkDist"></small></div><input type="range" id="linkDist" min="10" max="400" step="5" value="90"></div>
      <div class="slider"><div class="row"><label>Group pull</label><small id="v-groupPull"></small></div><input type="range" id="groupPull" min="0" max="0.3" step="0.01" value="0.04"></div>
      <button class="btn" id="reheat" style="width:100%;margin-top:6px">RE-SETTLE</button>
    </div>
  </details>
</div>

<div id="right"></div>
<div id="feed"><div class="muted" style="font-style:normal;font:500 10px var(--display);letter-spacing:.22em">LIVE ACTIVITY</div><div id="events"><div class="muted">Quiet for now.</div></div></div>

<div id="controls">
  <button class="btn" id="liveBtn" title="Live activity">LIVE<span class="badge" id="badge" hidden>0</span></button>
  <button class="btn" id="fitBtn" title="Fit everything">FIT</button>
  <button class="btn" id="zoomOut" title="Zoom out">−</button>
  <button class="btn" id="zoomIn" title="Zoom in">+</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
